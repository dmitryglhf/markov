name: Upstream watch

# GitHub cannot notify us about tags in a repository we do not own, so this
# polls. It never resolves anything: it builds the branch, commits the merge as
# it came out — conflict markers included — and hands a human a draft PR with an
# inventory of what is left. Draft is the safety catch; GitHub refuses to merge
# a draft, and this branch must never reach main unresolved.

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
    inputs:
      tag:
        description: "upstream tag to merge (default: latest published release)"
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write
  issues: write      # labels are an issues API, and gh pr create --label needs it

concurrency:
  group: upstream-watch

env:
  UPSTREAM: aaif-goose/goose
  GH_TOKEN: ${{ github.token }}
  # gh picks its repository from the git remotes, and this job adds `upstream`
  # pointing at aaif-goose/goose. Without pinning, every gh call — the label,
  # the pull request, the stale-PR check in the gate — lands on upstream.
  GH_REPO: ${{ github.repository }}

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          # GITHUB_TOKEN may not push anything under .github/workflows — the
          # remote rejects it outright and no `permissions:` key can grant it.
          # Every upstream merge touches those files, so the push needs a PAT
          # carrying Workflows: write. `gh` keeps using GITHUB_TOKEN below, so
          # the pull request stays authored by the bot and does not set CI off
          # on a commit that still has conflict markers in it.
          token: ${{ secrets.UPSTREAM_PR_TOKEN }}

      # /releases/latest already excludes prereleases and drafts. Picking the
      # highest tag instead would land on v2.0.0-rc-04-27-0, dead since April,
      # or on a vX.Y.0 tag that upstream cuts when it opens a release branch —
      # about a day before the release actually ships.
      - name: Resolve upstream release
        id: rel
        run: |
          tag="${{ inputs.tag }}"
          [ -n "$tag" ] || tag="$(gh api "repos/$UPSTREAM/releases/latest" --jq .tag_name)"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "branch=upstream-merge/$tag" >> "$GITHUB_OUTPUT"

      - name: Fetch upstream tag
        run: |
          git remote add upstream "https://github.com/$UPSTREAM" 2>/dev/null || true
          git fetch --no-tags upstream \
            "refs/tags/${{ steps.rel.outputs.tag }}:refs/tags/${{ steps.rel.outputs.tag }}"

      # Three ways there is nothing to do, and one way to be useful without
      # opening a second competing merge.
      - name: Decide whether to act
        id: gate
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          branch='${{ steps.rel.outputs.branch }}'

          if git merge-base --is-ancestor "$tag" HEAD; then
            echo "$tag is already merged into main" >> "$GITHUB_STEP_SUMMARY"
            echo "act=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          if git ls-remote --exit-code --heads origin "$branch" >/dev/null 2>&1; then
            echo "branch $branch already exists, work is under way" >> "$GITHUB_STEP_SUMMARY"
            echo "act=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          # An older merge still open: warn there instead of forking a rival
          # branch off a main that knows nothing about the previous release.
          stale="$(gh pr list --label upstream-merge --state open \
                     --json number,headRefName --jq '.[0].number // empty')"
          if [ -n "$stale" ]; then
            gh pr comment "$stale" --body \
              "Upstream released \`$tag\`. This pull request is now behind — land it on main and the next run will assemble the new one."
            echo "warned PR #$stale that $tag is out" >> "$GITHUB_STEP_SUMMARY"
            echo "act=false" >> "$GITHUB_OUTPUT"; exit 0
          fi

          echo "act=true" >> "$GITHUB_OUTPUT"

      - name: Merge
        if: steps.gate.outputs.act == 'true'
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b '${{ steps.rel.outputs.branch }}'
          # --no-commit so that both outcomes leave a merge in progress: the
          # policy pass needs MERGE_HEAD, and a merge that succeeded outright
          # would already have cleared it.
          git merge --no-ff --no-commit -m "merge upstream $tag" "$tag" \
            || echo "conflicts, as expected — the policy pass and the PR body take it from here"

      # .gitattributes assigns a policy per path, but git has no built-in
      # ours/theirs driver to carry it out, and a driver would have to be
      # registered in .git/config on every runner. Applied here instead.
      - name: Apply the merge policy
        if: steps.gate.outputs.act == 'true'
        id: policy
        run: |
          scripts/upstream-merge-policy.sh
          # "Clean" means nothing is left for a human, so it cannot be decided
          # before the policy has had its say.
          if [ -z "$(git ls-files --unmerged)" ]; then clean=true; else clean=false; fi
          echo "clean=$clean" >> "$GITHUB_OUTPUT"

      # Must run before the index is touched: committing wipes the unmerged
      # entries the inventory is built from.
      - name: Build PR body
        if: steps.gate.outputs.act == 'true'
        env:
          BRANCH: ${{ steps.rel.outputs.branch }}
        run: scripts/upstream-inventory.sh '${{ steps.rel.outputs.tag }}' > /tmp/body.md

      - name: Explain the conflicts
        if: steps.gate.outputs.act == 'true' && steps.policy.outputs.clean == 'false'
        continue-on-error: true
        env:
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
        run: scripts/upstream-explain.sh >> /tmp/body.md

      # Always: --no-commit left the merge open even when it went through cleanly.
      - name: Commit the merge as it came out
        if: steps.gate.outputs.act == 'true'
        run: |
          # `git add -A` stages the upstream copy of every file we deleted, so
          # the workflows and scripts this fork dropped on purpose would come
          # back invisibly inside a five-thousand-line diff. Keep the deletions.
          git status --porcelain | awk '$1 == "DU" { print $2 }' \
            | while read -r f; do git rm -q -f -- "$f"; done
          git add -A
          git commit --no-edit

      - name: Push and open the pull request
        if: steps.gate.outputs.act == 'true'
        run: |
          tag='${{ steps.rel.outputs.tag }}'
          branch='${{ steps.rel.outputs.branch }}'
          git push origin "$branch"

          # Swallowing this quietly once cost a run: the label failed to appear,
          # and the error only surfaced from gh pr create one line later.
          gh label create upstream-merge --color 5319e7 \
            --description "merge with an upstream release" \
            || echo "label already exists, or creation failed — see the error above"

          draft=--draft
          [ '${{ steps.policy.outputs.clean }}' = 'true' ] && draft=""

          gh pr create $draft \
            --base main --head "$branch" \
            --title "merge upstream $tag" \
            --label upstream-merge \
            --body-file /tmp/body.md
